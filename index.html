<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NFL Lottery — Scoreboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=11"/>
  <link rel="icon" href="favicon.ico"/>
  <link rel="manifest" href="/lottery/manifest.json">
  <meta name="theme-color" content="#10192b">
  <link rel="apple-touch-icon" href="/lottery/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/lottery/a2hs.js" defer></script>
</head>
<body>
<header class="site-header">
  <div class="container">
    <h1>🏈 Keens NFL Lottery</h1>
    <div class="meta">
      <span class="legend-dot afc"></span><span class="legend-label">AFC</span>
      <span class="legend-dot nfc"></span><span class="legend-label">NFC</span>
      <span class="legend-badge">Weeks in (parentheses) = WINNER</span>
    </div>
  </div>
</header>

<main class="container">
  <section id="potWrap" class="pot-wrap" aria-live="polite"></section>

  <section class="controls">
    <button id="refreshBtn" class="btn">Refresh</button>
    <div class="note">Data pulls from your Google Sheet. Totals are shown on the right of each card.</div>
  </section>

  <section id="cards" class="cards"></section>
</main>

<footer class="site-footer">
  <div class="container"><p>Designed by Kinnon</p></div>
</footer>

<script>
const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRIVvTEgE3OKW_mM43p_3MXRzEuZm1DIVvk6sG8GSxIlVh8sYv5Wl2GT6awHuKpuJx_rN3Q3u6Hz8gp/pub?gid=0&single=true&output=csv';
const cardsEl = document.getElementById('cards');
const potWrap = document.getElementById('potWrap');
const refreshBtn = document.getElementById('refreshBtn');

function money(v){ const n = parseFloat(String(v).replace(/[^\d.-]/g,'')) || 0; return n.toLocaleString(undefined,{style:'currency',currency:'USD',minimumFractionDigits:2}); }
function baseTeamName(s){
  const cleaned = String(s||'').replace(/\(([^)]*)\)/g,'').replace(/[–—]/g,'-').replace(/[^\w\s-]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
  if(!cleaned) return ''; return cleaned.split(' ').slice(-1)[0];
}
function teamCellHTML(original, conf){
  if(!original || !original.trim()) return '';
  const badges = [...original.matchAll(/\(([^)]+)\)/g)].map(m=>m[1]);
  const base = baseTeamName(original);
  const img = `<img class="team-logo" src="logos/${base}.svg" alt="${base} logo" onerror="this.classList.add('missing')">`;
  const name = original.replace(/\(([^)]+)\)/g,'').trim();
  const badgeHTML = badges.map(b => `<span class="week-badge">(${b})</span>`).join('');
  return `<div class="team ${conf}">${img}<span class="team-name">${name}</span>${badgeHTML}</div>`;
}

async function load(){
  cardsEl.innerHTML = '<div class="loading">Loading…</div>'; potWrap.innerHTML = '';
  try{
    const res = await fetch(SHEET_CSV, {cache:'no-store'}); const text = await res.text();
    const rows = text.split('\n').filter(r => r.trim().length); rows.shift();
    const players = []; let potTotal = null;
    rows.forEach(r => { const cols = r.split(','); if(cols.length < 6) return;
      const [player, afc1, afc2, nfc1, nfc2, total] = cols;
      if(String(player).trim().toLowerCase() === 'pot'){ potTotal = total; }
      else { players.push({player, afc1, afc2, nfc1, nfc2, total}); }
    });
    if(potTotal !== null){
      potWrap.innerHTML = `<article class="pot-card"><div class="pot-inner">
        <div class="pot-title">Weekly POT</div>
        <div class="pot-amount">${money(potTotal)}</div>
        <div class="pot-sub">Rolls over if no winner</div></div></article>`;
    }
    cardsEl.innerHTML = '';
    players.forEach(p => {
      const card = document.createElement('article'); card.className = 'card';
      card.innerHTML = `<div class="card-head">
        <div class="avatar">${(p.player||'?').trim().charAt(0).toUpperCase()}</div>
        <div class="who"><h2>${p.player||'n/a'}</h2><div class="sub">Current winnings</div></div>
        <div class="total ${(parseFloat(p.total)||0) > 0 ? 'won' : ''}">${money(p.total)}</div>
      </div>
      <div class="teams">
        <div class="col">
          <div class="col-title"><span class="dot afc"></span>AFC</div>
          ${teamCellHTML(p.afc1, 'afc')}
          ${teamCellHTML(p.afc2, 'afc')}
        </div>
        <div class="col">
          <div class="col-title"><span class="dot nfc"></span>NFC</div>
          ${teamCellHTML(p.nfc1, 'nfc')}
          ${teamCellHTML(p.nfc2, 'nfc')}
        </div>
      </div>`;
      cardsEl.appendChild(card);
    });
  }catch(err){
    cardsEl.innerHTML = '<div class="error">Could not load the sheet. Check the published CSV link.</div>'; console.error(err);
  }
}
refreshBtn.addEventListener('click', load); load();
</script>
</body>
</html>
